<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BrittsPacketTracer</title><link rel="stylesheet" href="css/styles.css"></head>
<body>
<header class="menu-bar"><div class="brand"><span class="brand-mark">B</span><div><strong>BrittsPacketTracer</strong><small>Network Simulation Workspace</small></div></div><nav><button id="newBtn">New</button><button id="saveBtn">Save</button><button id="loadBtn">Load</button><button id="exportBtn">Export</button><label class="button-file">Import<input id="importInput" type="file" accept=".json"></label></nav></header>
<div class="tool-strip"><button id="selectTool" class="active" title="Select and move">↖ Select</button><button id="connectTool" title="Connect devices">⌁ Connections</button><button id="deleteTool" title="Delete">⌫ Delete</button><span class="separator"></span><button id="pingTool">✉ Add Simple PDU</button><button id="recomputeBtn">↻ Recalculate</button><span id="statusPanel">Ready</span></div>
<main class="app-shell">
  <aside class="device-panel"><div class="panel-title">Network Components</div><div id="categoryTabs" class="category-tabs"></div><div id="devicePalette" class="palette"></div></aside>
  <section class="workspace-wrap"><div id="workspace" class="workspace"><svg id="linkLayer" class="link-layer"></svg><div id="emptyHint" class="empty-hint"><strong>Logical Workspace</strong><span>Drag a device here to start building.</span></div></div><div class="workspace-tabs"><button class="active">Logical</button><button disabled>Physical</button><span>Realtime</span></div></section>
  <aside class="inspector"><div class="panel-title">Selection</div><div id="inspectorContent"><p>Select a device or connection.</p></div></aside>
</main>
<div id="windowLayer" class="window-layer"></div>
<template id="deviceWindowTemplate"><section class="device-window"><header class="window-header"><div><strong class="window-title"></strong><small class="window-model"></small></div><div class="window-actions"><button data-action="pin" title="Keep on top">◇</button><button data-action="close" title="Close">×</button></div></header><nav class="window-tabs"></nav><div class="window-content"></div><footer class="window-footer"><span>BrittsPacketTracer Device Manager</span></footer></section></template>
<dialog id="pingDialog" class="small-dialog"><form method="dialog" class="dialog-header"><strong>Add Simple PDU</strong><button value="close">×</button></form><label>Source<select id="pingSource"></select></label><label>Destination IP<input id="pingDestination" placeholder="192.168.1.2"></label><button id="runPingBtn" type="button">Send</button><pre id="pingResult"></pre></dialog>
<script type="module" src="js/ui/app.js"></script></body></html>
