<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BrittsPacketTracer</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- ── Menu bar ── -->
  <header class="menu-bar">
    <div class="brand">
      <div class="brand-mark">B</div>
      <div>
        <strong>BrittsPacketTracer</strong>
        <small>Open-source Packet Tracer simulation</small>
      </div>
    </div>
    <nav>
      <button id="newBtn">New</button>
      <button id="saveBtn">Save</button>
      <button id="loadBtn">Load</button>
      <button id="exportBtn">Export</button>
      <label class="button-file">Import <input type="file" id="importInput" accept=".json"></label>
    </nav>
  </header>

  <!-- ── Tool strip ── -->
  <div class="tool-strip">
    <button id="selectTool" class="active">Select</button>
    <button id="connectTool">Connect</button>
    <button id="deleteTool">Delete</button>
    <span class="separator"></span>
    <button id="pingTool">Ping</button>
    <button id="recomputeBtn">Recalculate</button>
    <span id="statusPanel">Ready.</span>
  </div>

  <!-- ── Main app shell ── -->
  <div class="app-shell">

    <!-- Device panel (left) -->
    <div class="device-panel">
      <div class="panel-title">Device Types</div>
      <div class="category-tabs" id="categoryTabs"></div>
      <div class="palette" id="devicePalette"></div>
    </div>

    <!-- Workspace (center) -->
    <div class="workspace-wrap">
      <div class="workspace" id="workspace">
        <svg class="link-layer" id="linkLayer"></svg>
        <div class="empty-hint" id="emptyHint">
          <strong>Drag a device</strong>
          <span>from the left panel onto the canvas</span>
        </div>
      </div>
      <div class="workspace-tabs">
        <button>Logical</button>
        <span>Topology</span>
      </div>
    </div>

    <!-- Inspector (right) -->
    <div class="inspector">
      <div class="panel-title">Properties</div>
      <div id="inspectorContent"><p>Select a device or connection.</p></div>
    </div>

  </div>

  <!-- ── Floating device windows ── -->
  <div class="window-layer" id="windowLayer"></div>

  <!-- ── Device window template ── -->
  <template id="deviceWindowTemplate">
    <div class="device-window">
      <div class="window-header">
        <div>
          <strong class="window-title"></strong>
          <small class="window-model"></small>
        </div>
        <div class="window-actions">
          <button data-action="pin" title="Pin window">◇</button>
          <button data-action="close" title="Close">✕</button>
        </div>
      </div>
      <div class="window-tabs"></div>
      <div class="window-content"></div>
      <div class="window-footer">BrittsPacketTracer IOS-compatible simulation</div>
    </div>
  </template>

  <!-- ── Ping dialog ── -->
  <dialog id="pingDialog" class="small-dialog">
    <div class="dialog-header">
      <strong>Ping</strong>
      <button onclick="document.getElementById('pingDialog').close()">✕</button>
    </div>
    <label>Source device
      <select id="pingSource"></select>
    </label>
    <label>Destination IP
      <input id="pingDestination" placeholder="e.g. 192.168.1.1">
    </label>
    <button id="runPingBtn">Send Ping</button>
    <pre id="pingResult"></pre>
  </dialog>

  <script type="module" src="js/ui/app.js"></script>
</body>
</html>
